
<!DOCTYPE html>
<html lang="en">
<head>

  <title>KARs Garage — Air Ride</title>

  <!-- Favicon -->
  <link rel="icon" type="image/webp" href="/icons/garage-icon-black.webp" />

  <!-- Fonts (fallback Inter) -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<body class="airride">

        <a href="/air-ride.html" class="active">Air Ride</a>
