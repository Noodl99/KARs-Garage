
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KARs Garage</title>

  <!-- Favicon -->
  <link rel="icon" href="/icons/garage-icon-black.webp" type="image/webp" sizes="512x512" />

  <!-- Fonts (fallback Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Site styles -->
  <link rel="stylesheet" href="/style.css" />

<body class="home">
  <!-- Top bar -->
  <header class="topbar">
    <div class="container bar-inner">
      <div class="brand-logo" aria-hidden="true">🏁</div>
      <div class="brand-name">KARs Garage</div>
      <nav class="site-nav">
        <a href="/" class="active">Home</a>
        <a href="/air-ride.html">Air Ride</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="hero-content container">
      <h1 class="hero-title">KIRBY AIR RIDERS GARAGE</h1>
    </div>
  </section>

  <!-- Tiles -->
  <main class="container">
    <div class="tile-grid">
      <a class="tile tile-airride" href="/air-ride.html">
        <div class="tile-label">Air Ride</div>
      </a>
      <a class="tile tile-topride" href="#">
        <div class="tile-label">Top Ride</div>

      <a class="tile tile-citytrial" href="#">

      </a>
      <a class="tile tile-roadtrip" href="#">
        <div class="tile-label">Road Trip</div>
      </a>
    </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> KARs Garage</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</html>
