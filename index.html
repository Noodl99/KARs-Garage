
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>KARs Garage - Home</title>
  <link rel="icon" type="image/png" href="icons/garage-icon-white.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="style.css" />
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FJM6HX5VMZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-FJM6HX5VMZ');
</script>
<body class="page-home">
  <!-- Top bar -->
  <header class="topbar fixed">
    <div class="container bar-inner">
      <img class="brand-logo-img" src="icons/garage-icon-white.png" alt="KARs logo" />
      <a class="brand-name" href="./" aria-label="Home">KARs Garage</a>
      <nav class="site-nav" aria-label="Site">
        <a href="air-ride.html">Air Ride</a>
        <a href="top-ride.html">Top Ride</a>
        <a href="city-trial.html">City Trial</a>
        <a href="road-trip.html">Road Trip</a>
        <a href="extras.html">Extras</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero hero--home" aria-label="Intro">
    <div class="hero-bg hero-bg--top" aria-hidden="true"></div>
    <div class="hero-content hero-content--center">
      <h1 class="hero-title--76">KIRBY AIR RIDERS GARAGE</h1>
    </div>
  </section>



<!-- Tiles carousel (single horizontal strip under the hero) -->
<div class="tile-strip">
  <div class="tile-carousel" aria-label="Site sections">
    <div class="tile-belt">
      <a class="tile tile-airride"   href="air-ride.html"   aria-label="Air Ride"></a>
      <a class="tile tile-topride"   href="top-ride.html"   aria-label="Top Ride"></a>
      <a class="tile tile-citytrial" href="city-trial.html" aria-label="City Trial"></a>
      <a class="tile tile-roadtrip"  href="road-trip.html"  aria-label="Road Trip"></a>
      <a class="tile tile-extras"    href="extras.html"     aria-label="Extras"></a>
    </div>
  </div>
  <!-- Carousel arrows -->
  <button class="tile-nav tile-nav--left"  type="button" aria-label="Scroll left">‹</button>
  <button class="tile-nav tile-nav--right" type="button" aria-label="Scroll right">›</button>
</div> <!-- end .tile-strip -->



<!-- ===== Dashboard (Home) ===== -->
<section id="dashboard" class="dashboard container" aria-label="Site Stats">


<!-- ===== Pre-rendered Hero Strip (no flash) ===== -->
<div id="dash-hero">
  <div class="hero-grid">
    <div class="hero-left">
      <div class="dash-card">
        <h3>Record Spotlight</h3>
        <div id="hero-spotlight-embed" class="dash-embed dash-embed--sm"></div>
        <div id="hero-spotlight-meta" class="dash-meta"></div>
      </div>

      <div class="dash-card">
        <h3>Latest Record</h3>
        <div id="hero-latest-embed" class="dash-embed dash-embed--sm"></div>
        <div id="hero-latest-meta" class="dash-meta"></div>
      </div>
    </div>

    <div class="hero-right">
      <div id="delta-ar-big" class="delta-big"></div>
      <div id="delta-tr-big" class="delta-big"></div>
    </div>
  </div>
</div>

  <!-- Charts row -->
  <div class="dash-row">
    <div class="dash-card" id="dash-char">
      <h3>Most Popular Riders</h3>
      <div class="dash-chart" id="chart-rider"></div>
    </div>
    <div class="dash-card" id="dash-machine">
      <h3>Most Popular Machines</h3>
      <div class="dash-chart" id="chart-machine"></div>
    </div>
    <div class="dash-card" id="dash-player">
      <h3>Player with Most Records</h3>
      <div class="dash-chart" id="chart-player"></div>
    </div>
  </div>

  <!-- Search -->
  <div class="dash-row">
    <div class="dash-card wide" id="dash-search">
      <h3>Filter Records</h3>
      <div class="dash-filters" id="search-filters"></div>
      <div class="dash-table" id="search-table"></div>
    </div>
  </div>
</section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year">2026</span> KARs Garage</span>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="dashboard.js" defer></script>
</body>
</html>
